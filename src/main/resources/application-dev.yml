spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cardapio
    username: cardapio
    password: cardapio
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    # Em dev, db/seed é incluído para popular massa de teste idempotente
    # (R__seed_test_data.sql). Em staging/prod a localização permanece apenas db/migration.
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    org.springframework.modulith: INFO
    org.flywaydb: INFO

cardapio:
  security:
    jwt:
      secret: dev-secret-change-me-must-be-long-enough-32bytes!!
      access-token-ttl: 15m
      refresh-token-ttl: 30d
