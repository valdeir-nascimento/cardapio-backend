spring:
  application:
    name: cardapio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  modulith:
    events:
      jdbc-schema-initialization:
        enabled: false   # we manage schema with Flyway

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

mercadopago:
  enabled: ${MP_ENABLED:false}
  access-token: ${MP_ACCESS_TOKEN:TEST-DUMMY}
  webhook-secret: ${MP_WEBHOOK_SECRET:test-webhook-secret}
  notification-url: ${MP_NOTIFICATION_URL:http://localhost:8080/api/v1/webhooks/mercado-pago}

resilience4j:
  timelimiter:
    instances:
      mercadopago:
        timeout-duration: 5s
  retry:
    instances:
      mercadopago:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
  circuitbreaker:
    instances:
      mercadopago:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
