spring:
  application:
    name: cardapio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  modulith:
    events:
      jdbc-schema-initialization:
        enabled: false   # we manage schema with Flyway

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: cardapio-backend

mercadopago:
  enabled: ${MP_ENABLED:false}
  access-token: ${MP_ACCESS_TOKEN:TEST-DUMMY}
  webhook-secret: ${MP_WEBHOOK_SECRET:test-webhook-secret}
  notification-url: ${MP_NOTIFICATION_URL:http://localhost:8080/api/v1/webhooks/mercado-pago}

resend:
  enabled: ${RESEND_ENABLED:false}
  api-key: ${RESEND_API_KEY:test-key}
  from: ${RESEND_FROM:no-reply@cardapio.local}
  base-url: ${RESEND_BASE_URL:https://api.resend.com}

wppconnect:
  enabled: ${WPPCONNECT_ENABLED:false}
  session: ${WPPCONNECT_SESSION:cardapio}
  token: ${WPPCONNECT_TOKEN:dummy}
  base-url: ${WPPCONNECT_BASE_URL:http://localhost:21465}

r2:
  enabled: ${R2_ENABLED:false}
  access-key-id: ${R2_ACCESS_KEY_ID:dummy}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:dummy}
  endpoint: ${R2_ENDPOINT:https://example.r2.cloudflarestorage.com}
  bucket: ${R2_BUCKET:cardapio-qr}
  region: ${R2_REGION:auto}

qr:
  size-px: ${QR_SIZE_PX:512}
  presigned-url-ttl-seconds: ${QR_PRESIGNED_URL_TTL_SECONDS:600}
  storage:
    type: ${QR_STORAGE_TYPE:filesystem}
    path: ${QR_STORAGE_PATH:./data/qr}
    public-base-url: ${QR_PUBLIC_BASE_URL:http://localhost:8080}
    signing-secret: ${QR_SIGNING_SECRET:dev-qr-signing-secret-change-me}

oauth:
  google:
    enabled: ${OAUTH_GOOGLE_ENABLED:false}
    client-id: ${OAUTH_GOOGLE_CLIENT_ID:dummy.apps.googleusercontent.com}
    issuer: ${OAUTH_GOOGLE_ISSUER:https://accounts.google.com}
    jwks-uri: ${OAUTH_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
  apple:
    enabled: ${OAUTH_APPLE_ENABLED:false}
    client-id: ${OAUTH_APPLE_CLIENT_ID:com.example.dummy}
    issuer: ${OAUTH_APPLE_ISSUER:https://appleid.apple.com}
    jwks-uri: ${OAUTH_APPLE_JWKS_URI:https://appleid.apple.com/auth/keys}

jwks:
  cache-ttl: ${JWKS_CACHE_TTL:1h}
  fetch-timeout-ms: ${JWKS_FETCH_TIMEOUT_MS:5000}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  rules:
    - paths:
        - /api/v1/auth/login
        - /api/v1/admin/auth/login
      methods: [POST]
      capacity: 10
      refill-tokens: 10
      refill-period: 1m
    - paths:
        - /api/v1/auth/social/google
        - /api/v1/auth/social/apple
      methods: [POST]
      capacity: 30
      refill-tokens: 30
      refill-period: 1m
    - paths:
        - /api/v1/orders
      methods: [POST]
      capacity: 60
      refill-tokens: 60
      refill-period: 1m

notification:
  dispatch:
    enabled: ${NOTIFICATION_DISPATCH_ENABLED:true}
    fixed-delay-ms: ${NOTIFICATION_DISPATCH_FIXED_DELAY_MS:30000}
    initial-delay-ms: ${NOTIFICATION_DISPATCH_INITIAL_DELAY_MS:10000}

resilience4j:
  timelimiter:
    instances:
      mercadopago:
        timeout-duration: 5s
      resend:
        timeout-duration: 5s
      wppconnect:
        timeout-duration: 5s
  retry:
    instances:
      mercadopago:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
      resend:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
      wppconnect:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
  circuitbreaker:
    instances:
      mercadopago:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      resend:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      wppconnect:
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
