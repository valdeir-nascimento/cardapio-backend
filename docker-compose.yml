services:
  postgres:
    image: postgres:16-alpine
    container_name: cardapio-postgres
    environment:
      POSTGRES_USER: cardapio
      POSTGRES_PASSWORD: cardapio
      POSTGRES_DB: cardapio
    ports:
      - "5432:5432"
    volumes:
      - cardapio-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardapio -d cardapio"]
      interval: 5s
      timeout: 5s
      retries: 5

  wppconnect:
    image: wppconnect/server-cli:latest
    container_name: cardapio-wppconnect
    command: >
      --secretKey ${WPPCONNECT_SECRET_KEY:-THISISMYSECURETOKEN}
      --host 0.0.0.0
      --port 21465
    ports:
      - "21465:21465"
    volumes:
      - cardapio-wpp-tokens:/usr/src/server-cli/tokens
      - cardapio-wpp-userdata:/usr/src/server-cli/userDataDir
    restart: unless-stopped

volumes:
  cardapio-pg:
  cardapio-wpp-tokens:
  cardapio-wpp-userdata:
